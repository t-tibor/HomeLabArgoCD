apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-k8s
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/t-tibor/HomeLabArgoCD.git
    targetRevision: main
    path: manifests/mcp-k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-k8s
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
