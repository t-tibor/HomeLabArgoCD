apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: mcp-k8s
  labels:
    app: kubernetes-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-mcp-server
  template:
    metadata:
      labels:
        app: kubernetes-mcp-server
    spec:
      serviceAccountName: kubernetes-mcp-server
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubernetes-mcp-server
          image: ghcr.io/containers/kubernetes-mcp-server:v0.0.66
          imagePullPolicy: IfNotPresent
          args:
            - "--port=8080"              # Streamable HTTP (/mcp) + SSE (/sse)
            - "--read-only"               # belt: app-level refusal of write tools
            - "--disable-destructive"     # extra safety net even if --read-only is ever removed
            - "--toolsets=core"           # skip helm/tekton/kiali toolsets you don't need
            - "--disable-multi-cluster"   # single in-cluster context only
            - "--stateless"               # fine for a shared Deployment behind a Service
            - "--cluster-provider=in-cluster"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
