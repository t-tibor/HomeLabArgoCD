nextcloud:
  host: nextcloud.local
  trustedDomains:
    - nextcloud.local
    - nextcloud.nextcloud.svc.cluster.local
    - nextcloud.tusorihomelab.org
    - 192.168.1.107
  existingSecret:
    enable: true
    secretName: nextcloud-admin-secret
    usernameKey: username
    passwordKey: password

phpClientHttpsFix:
  enabled: true
  protocol: https

internalDatabase:
  enabled: true

service:
  type: NodePort
  nodePort: 32284

persistence:
  enabled: true
  storageClass: "-"
  existingClaim: nextcloud-pvc