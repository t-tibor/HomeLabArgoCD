apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-mcp-server-netpol
  namespace: mcp-prometheus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-mcp-server
      app.kubernetes.io/instance: mcp-prometheus
  policyTypes:
    - Egress
  egress:
    # Prometheus (prometheus-stack-kube-prom-prometheus.monitoring:9090)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
